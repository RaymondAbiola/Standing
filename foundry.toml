[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
gas_reports = ["*"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 256
fail_on_revert = false

# Heavier settings for CI and for the invariant suite in commit 17.
[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 500

[profile.lite]
optimizer = false

[profile.lite.fuzz]
runs = 64

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[lint]
exclude_lints = ["asm-keccak256"]

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
# One Etherscan V2 key covers every supported chain, Arbitrum included. There
# is no separate Arbiscan key any more.
arbitrum_sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 421614}

# Robinhood Chain runs Blockscout, which takes no key. Untested until the
# mainnet deploy; if it misbehaves, pass the verifier explicitly instead:
#   --verifier blockscout --verifier-url https://robinhoodchain.blockscout.com/api
robinhood = {key = "", chain = 4663, url = "https://robinhoodchain.blockscout.com/api"}
