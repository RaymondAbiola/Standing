<!doctype html>
<meta charset="utf-8">
<title>Standing closing card</title>
<style>
  :root { --surface:#0b0d0f; --ink:#f2f5f6; --muted:#9aa4ac; --accent:#3ce0b0; --line:#272c31; }
  :root[data-theme="light"] { --surface:#f6f7f8; --ink:#0c0f11; --muted:#4a535a; --accent:#06795a; --line:#dfe4e7; }
  * { margin:0; padding:0; box-sizing:border-box; }

  /* See survey-frame.html for why the stage is scaled rather than fixed. */
  html, body { width:100%; height:100%; overflow:hidden; }
  body { position:relative; }
  body {
    background: var(--surface); color: var(--ink);
    font-family: Inter, "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position:absolute; top:0; left:0;
    width:1920px; height:1080px; transform-origin:top left;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  /* the same accent pool the site hero sits in */
  .stage::before {
    content:""; position:absolute; top:-30%; left:-10%; right:-10%; height:700px;
    background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 68%);
  }
  img { width:756px; height:192px; position:relative; }
  .tag { font-size:30px; color:var(--muted); margin-top:28px; position:relative; }
  .url {
    font-size:52px; font-weight:650; letter-spacing:-0.02em; margin-top:64px;
    color:var(--accent); position:relative;
  }
  .meta {
    margin-top:56px; padding-top:34px; border-top:1px solid var(--line);
    display:flex; gap:56px; font-size:23px; color:var(--muted);
    position:relative; width:860px; justify-content:center;
  }
  .meta b { color:var(--ink); font-weight:600; }
</style>
<body>
<div class="stage">
  <img src="../png/lockup-dark-1008x256.png" alt="Standing">
  <p class="tag">Standing orders for stablecoins, with recourse.</p>

  <p class="url">REPLACE-WITH-LIVE-URL</p>

  <div class="meta">
    <span>Live on <b>Robinhood Chain</b> and <b>Arbitrum</b></span>
    <span><b>REPLACE-WITH-CONTACT</b></span>
  </div>
</div>

<script>
  const stage = document.querySelector(".stage");
  const fit = () => {
    // A grid item bigger than its container start-aligns rather than centring,
    // so the offset is applied here instead of left to the layout.
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    const x = (innerWidth - 1920 * s) / 2;
    const y = (innerHeight - 1080 * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  };
  addEventListener("resize", fit);
  fit();
</script>
