name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Tests
        run: forge test -vvv

  # Separate and non-blocking: these hit a public rate-limited endpoint, so a
  # network hiccup must not red the build. The hermetic suite above is the gate.
  fork:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ARBITRUM_SEPOLIA_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Fork tests against deployed Permit2
        run: forge test --match-path 'test/fork/*' -vvv

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run lint

      # solhint's no-console rule is off, because console.log is how a Foundry
      # deploy script reports what it did and never reaches deployed bytecode.
      # src/ is a different matter: a console import there is dead weight in
      # every deployment, so it is checked directly rather than left to a rule
      # that cannot tell the two trees apart.
      - name: No console in deployed sources
        run: |
          if grep -rn "console" src/; then
            echo "::error::console usage in src/ ships in deployed bytecode"
            exit 1
          fi
